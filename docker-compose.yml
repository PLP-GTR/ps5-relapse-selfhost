# Self-hosted PS5 Relapse exploit host (DNS + HTTPS page).
#
# Prerequisites (run once):
#   cp .env.example .env   # set SERVER_IP
#   docker compose run --rm --build setup
#
# Then:
#   docker compose up -d
#
# Standalone hosting uses ports 80/443 by default.
# Point the PS5 DNS at SERVER_IP, open User's Guide, press START.
# GUIDE_IP may select a separate reverse proxy IP for the guide domains.
# Optional Unraid / Nginx Proxy Manager setup: see docs/unraid.md.

services:
  # One-off preparation helper. Explicit `compose run setup` enables it;
  # a normal `compose up` starts only the DNS and web services.
  setup:
    profiles: ["tools"]
    build:
      context: ./docker/setup
    working_dir: /work
    restart: "no"
    volumes:
      - .:/work

  dns:
    image: alpine:3.20
    container_name: relapse-dns
    # Host networking so dnsmasq can bind UDP/TCP 53 without port-map quirks.
    # Requires Docker on Linux (Docker Desktop "host" mode is not equivalent).
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    # Install dnsmasq at start so we stay on a plain Alpine image.
    command: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && dnsmasq -k --log-facility=-"]
    cap_add:
      - NET_BIND_SERVICE
    # Binding :53 often also needs elevated privileges on hardened hosts.
    # Uncomment if dnsmasq cannot bind port 53:
    # privileged: true

  web:
    image: nginx:alpine
    container_name: relapse-web
    restart: unless-stopped
    ports:
      - "${SERVER_IP:?Set SERVER_IP in .env}:${WEB_HTTP_PORT:-80}:80"
      - "${SERVER_IP:?Set SERVER_IP in .env}:${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - dns
